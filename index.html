<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de colores</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/styles.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <header>
        <h1>C O L O R E S</h1>
        <p>Genera tu paleta de colores aleatorios</p>

    </header>

    <main>

        <select name="selectColor" id="selectColor">
            <option value="6">6 Colores</option>
            <option value="8">8 Colores</option>
            <option value="9">9 Colores</option>
        </select>

        <select name="selectFormato" id="selectFormato">
            <option value="hsl">HSL</option>
            <option value="rgba">RGBA</option>
        </select>

        <button id="generarPaleta">Generar paleta de colores</button>

        <div id="contenedorColores"></div>

        <button id="copiarPaleta">Copiar</button>

    </main>

    <footer>
        <p>© 2026 Proyecto Colores - Creado por un Desarrollador Web</p>
    </footer>



</body>

</html>
